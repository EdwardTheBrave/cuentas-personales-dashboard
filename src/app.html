<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
/* Layout: cabecera + navegación por secciones -> filtros globales -> Resumen (KPIs, patrimonio, saldos por grupo)
   -> Zoom de mes -> Evolutivos. Tema claro único, elegido a propósito: el usuario prefiere fondos claros. */
:root {
  color-scheme: light;
  /* Paleta "grafito y petróleo": fondo grafito suave, tarjetas blancas, acento petróleo. */
  --bg: #2c3135;
  --on-bg: #f3f5f4;
  --on-bg-muted: #c4cbcd;
  --surface: #ffffff;
  --surface-2: #f5f7f6;
  --ink: #161b1d;
  --ink-2: #485256;
  --muted: #6c777a;
  --line: #e2e6e5;
  --line-2: #cbd3d2;
  --accent: #0a7d8c;
  --accent-soft: #def0f2;
  --band: #0c5560;
  --band-ink: #ffffff;
  --inc: #0f7a52; --inc-strong: #1f9466; --inc-soft: #e2f3ea;
  --exp: #b3263e; --exp-strong: #d0344f; --exp-soft: #fbe8eb;
  --net: #1d3f66;
  /* Categórica validada (CVD adyacente ≥ 9,9; visión normal ≥ 24; contraste ≥ 3:1). */
  --s1: #0a8fa0; --s2: #c97a00; --s3: #6b4fc8; --s4: #e2683c;
  --s5: #2a5fb8; --s6: #4a9d2f; --s7: #d2508a; --s8: #9a8a00;
  --other: #a7adab;
  --heat: 10, 143, 160;
  --warn-bg: #fff4e0; --warn-ink: #7a4b00;
  --err-bg: #fdecec; --err-ink: #8f1d1d;
  --font-body: "Hanken Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-num: "Spline Sans Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1320px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 15px; font-weight: 650; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Cabecera */
.top { color: var(--on-bg); }
.top .eyebrow, #footnote { color: var(--on-bg-muted); }
.status { color: var(--on-bg) !important; }
#main > .empty, .loader { color: var(--on-bg) !important; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.top .title { display: flex; flex-direction: column; gap: 2px; }
.status { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--ink-2); font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.ok { background: var(--inc-strong); } .dot.busy { background: var(--s2); } .dot.bad { background: var(--exp-strong); }
.btn { border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 12px; font-weight: 600; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 6px; }
.btn:disabled { opacity: .6; cursor: default; }
.top .btn { background: var(--surface); color: var(--ink); border-color: var(--surface); }
.top .btn:hover:not(:disabled) { background: var(--accent-soft); }

.banner { border-radius: var(--r); padding: 12px 14px; font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.banner.warn { background: var(--warn-bg); color: var(--warn-ink); }
.banner.err { background: var(--err-bg); color: var(--err-ink); }
.banner p { margin: 0; flex: 1 1 320px; }

/* Filtros */
.filters { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 10px;
  position: relative; z-index: 20; }
@media (min-width: 1180px) { .filters { position: sticky; top: env(safe-area-inset-top, 0px); } }
.frow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.field { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; height: 34px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.field select, .field input { border: 0; background: transparent; height: 32px; outline: none; min-width: 0; }
.field input[type="number"] { width: 84px; }
.field input[type="search"] { width: 180px; }
.field:focus-within { border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface-2); height: 34px; }
.seg button { border: 0; background: transparent; padding: 0 10px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
details.ms { position: relative; }
details.ms > summary { list-style: none; cursor: pointer; }
details.ms > summary::-webkit-details-marker { display: none; }
details.ms > summary .val { font-weight: 600; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.ms > summary::after { content: ""; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg) translateY(-2px); margin-left: 4px; }
.pop { position: absolute; top: calc(100% + 6px); left: 0; z-index: 30; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r);
  box-shadow: 0 10px 30px rgba(0,0,0,.14); width: min(300px, calc(100vw - 32px)); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.pop .acts { display: flex; gap: 4px; justify-content: space-between; }
.pop .list { max-height: 260px; overflow: auto; display: flex; flex-direction: column; }
.pop label.opt { display: flex; gap: 8px; align-items: center; padding: 5px 6px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.pop label.opt:hover { background: var(--surface-2); }
.pop label.opt .c { margin-left: auto; color: var(--muted); font-size: 11.5px; }
.pop input[type="search"] { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--surface-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--ink); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 12.5px; }
.chip button { border: 0; background: transparent; color: var(--ink-2); width: 20px; height: 20px; border-radius: 50%; line-height: 1; }
.chip button:hover { background: var(--line-2); }
.ftoggle { display: none; }

/* Tarjetas */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.span-12 { grid-column: span 12; } .span-7 { grid-column: span 7; } .span-5 { grid-column: span 5; } .span-6 { grid-column: span 6; }
.chead { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.chead .sub { color: var(--muted); font-size: 12.5px; }
.chart { width: 100%; height: 320px; }
.chart.tall { height: 360px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.kpis { display: grid; gap: 16px; grid-template-columns: 1.4fr repeat(4, minmax(0, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .v { font-size: 22px; font-weight: 500; }
.kpi.hero .v { font-size: 30px; }
.kpi .d { font-size: 12.5px; color: var(--ink-2); display: flex; gap: 10px; flex-wrap: wrap; }
.delta.good { color: var(--inc); } .delta.bad { color: var(--exp); }
.delta::before { content: ""; display: inline-block; width: 0; height: 0; margin-right: 4px; vertical-align: 2px;
  border-left: 4px solid transparent; border-right: 4px solid transparent; }
.delta.rise::before { border-bottom: 6px solid currentColor; }
.delta.fall::before { border-top: 6px solid currentColor; }

/* Tablas */
.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: var(--surface-2); position: sticky; top: 0; z-index: 1; }
td.r, th.r { text-align: right; }
tr:last-child td { border-bottom: 0; }
.matrix th:first-child, .matrix td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 2; }
.matrix th:first-child { background: var(--surface-2); z-index: 3; }
.matrix tr.grp td { background: var(--surface-2); font-weight: 650; }
.matrix tr.grp td:first-child { background: var(--surface-2); }
.matrix tr.tot td { font-weight: 650; border-top: 1px solid var(--line-2); }
.matrix td.z { color: var(--muted); }
.matrix td.tc { border-left: 1px solid var(--line-2); font-weight: 600; }
.sortable th { cursor: pointer; user-select: none; }
.sortable th[aria-sort="ascending"]::after { content: " ↑"; }
.sortable th[aria-sort="descending"]::after { content: " ↓"; }
.scrollbox { max-height: 420px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); }
.tag.inc { border-color: var(--s1); color: var(--ink); }
.amt-inc { color: var(--ink); } .amt-exp { color: var(--ink); }
.muted { color: var(--muted); }

/* Zoom */
.zoomhead { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.zoomnav { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.zoomnav .btn.ghost { white-space: nowrap; }
.mk { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.mk div { background: var(--surface); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mk .v { font-size: 18px; }
.tree details { border-bottom: 1px solid var(--line); }
.tree details:last-child { border-bottom: 0; }
.tree summary { list-style: none; display: grid; grid-template-columns: 1fr 110px 110px; gap: 8px; padding: 8px 10px; cursor: pointer; font-weight: 650; align-items: center; }
.tree summary::-webkit-details-marker { display: none; }
.tree summary .n::before { content: "▸"; display: inline-block; width: 14px; color: var(--muted); transition: transform .15s; }
.tree details[open] summary .n::before { transform: rotate(90deg); }
.tree .row { display: grid; grid-template-columns: 1fr 110px 110px; gap: 8px; padding: 5px 10px 5px 30px; font-size: 13px; border-top: 1px dashed var(--line); }
.tree .row .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree .hdr { display: grid; grid-template-columns: 1fr 110px 110px; gap: 8px; padding: 6px 10px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.r { text-align: right; }
.empty { padding: 24px; text-align: center; color: var(--muted); }
.hint { font-size: 12.5px; color: var(--muted); }
.loader { padding: 60px 16px; text-align: center; color: var(--ink-2); display: flex; flex-direction: column; gap: 14px; align-items: center; }
.loader .bar { width: 180px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; position: relative; }
.loader .bar::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--accent); border-radius: 2px; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
@media (prefers-reduced-motion: reduce) { .loader .bar::after { animation: none; } }

/* Secciones con cabecera propia */
.section { display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 150px; }
.shead { background: var(--band); color: var(--band-ink); border-radius: var(--r); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.shead .eyebrow { color: rgba(255,255,255,.72); }
.shead h2 { font-size: 19px; font-weight: 700; }
.shead .field { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.28); }
.shead .field label { color: rgba(255,255,255,.75); }
.shead .field select { color: var(--band-ink); }
.shead .field select option { color: var(--ink); background: var(--surface); }
.shead .btn { background: transparent; color: var(--band-ink); border-color: rgba(255,255,255,.35); }
.shead .btn:hover { border-color: var(--band-ink); }
.shead .btn, .zoomnav .btn { white-space: nowrap; }
.zoomnav .btn[aria-label] { width: 34px; height: 34px; padding: 0; }
.secnav { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.secnav a { color: var(--accent); font-weight: 600; font-size: 13px; text-decoration: none; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); }
.secnav a:hover { background: var(--accent); color: var(--surface); }

/* Ingresos y gastos */
.inc { color: var(--inc); } .exp { color: var(--exp); }
.tag.inc { background: var(--inc-soft); border-color: transparent; color: var(--inc); }
.tag.exp { background: var(--exp-soft); border-color: transparent; color: var(--exp); }
.mk div.kinc { background: var(--inc-soft); } .mk div.kexp { background: var(--exp-soft); }
.ztotal { border-top: 1px solid var(--line-2); padding-top: 6px; }
.mk div.kinc .v { color: var(--inc); } .mk div.kexp .v { color: var(--exp); }

/* Saldos agrupados */
.acct tr.g td { font-weight: 700; background: var(--surface-2); cursor: pointer; }
.acct tr.g td:first-child::before { content: "−"; display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; margin-right: 8px; border: 1px solid var(--line-2); border-radius: 3px; font-size: 11px; color: var(--ink-2); background: var(--surface); }
.acct tr.g.closed td:first-child::before { content: "+"; }
.acct tr.c td:first-child { padding-left: 34px; color: var(--ink-2); }
.acct tfoot td { font-weight: 700; border-top: 1px solid var(--line-2); }

/* Leyenda pulsable */
.legend button.lg { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.legend button.lg[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); background: var(--surface-2); }
.legend button.lg.dim { opacity: .5; }

/* Cambio de panel e inversiones */
.viewswitch { height: 38px; background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.22); }
.viewswitch button { color: var(--on-bg); padding: 0 16px; font-size: 13.5px; }
.viewswitch button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
.shead .seg { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.25); flex-wrap: wrap; height: auto; min-height: 34px; }
.shead .seg button { color: rgba(255,255,255,.85); min-height: 32px; }
.shead .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); }
.kpis.inv { grid-template-columns: 1.4fr repeat(4, minmax(0, 1fr)); }
.mix { display: flex; flex-direction: column; gap: 14px; }
.mixrow { display: flex; flex-direction: column; gap: 5px; }
.mixtop { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-weight: 600; }
.mixtop i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 8px; }
.mixbar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.mixbar span { display: block; height: 100%; border-radius: 4px; }
.mixpl { font-size: 12.5px; color: var(--muted); }
.invpos tr.c { cursor: pointer; }
.invpos tr.c:hover td { background: var(--accent-soft); }
.invpos tr.g td:first-child::before { content: none; }
.st { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
.st.live { background: var(--accent-soft); color: var(--accent); }
.st.yield { background: var(--inc-soft); color: var(--inc); }
.st.closed { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.tag.dep { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.tag.wd { background: #fdf1e0; border-color: transparent; color: #8a5300; }
.dropzone { background: var(--surface); border: 2px dashed var(--line-2); border-radius: var(--r); padding: 40px 24px; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; max-width: 640px; margin: 24px auto; }
.dropzone p { margin: 0; color: var(--ink-2); max-width: 52ch; }
body.dragging .dropzone, body.dragging .wrap { outline: 3px dashed var(--accent); outline-offset: -6px; }
/* Preguntar a tus datos */
.askfab { position: fixed; right: calc(20px + env(safe-area-inset-right, 0px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 40;
  background: var(--accent); color: var(--surface); border: 0; border-radius: 999px; padding: 12px 20px; font-weight: 700; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
.askfab:hover { filter: brightness(1.08); }
.askpanel { position: fixed; top: 0; right: 0; bottom: 0; z-index: 60; width: min(480px, 100vw); background: var(--surface); color: var(--ink);
  box-shadow: -12px 0 40px rgba(0,0,0,.35); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.askhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; background: var(--band); color: var(--band-ink); }
.askhead .eyebrow { color: rgba(255,255,255,.72); }
.askhead h2 { font-size: 17px; }
.askhead .btn { background: transparent; color: var(--band-ink); border-color: rgba(255,255,255,.35); }
.asklog { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; background: var(--surface-2); }
.askintro { display: flex; flex-direction: column; gap: 10px; color: var(--ink-2); }
.askintro p { margin: 0; }
.asksug { display: flex; flex-direction: column; gap: 6px; }
.chipbtn { text-align: left; border: 1px solid var(--line-2); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-size: 13px; color: var(--ink); }
.chipbtn:hover { border-color: var(--accent); background: var(--accent-soft); }
.msg { border-radius: 12px; padding: 10px 14px; font-size: 13.5px; line-height: 1.5; max-width: 100%; min-width: 0; }
.msg.user { align-self: flex-end; background: var(--accent); color: var(--surface); max-width: 85%; white-space: pre-wrap; }
.msg.bot { align-self: stretch; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.msg.bot .body p { margin: 0 0 8px; } .msg.bot .body p:last-child { margin-bottom: 0; }
.msg.bot .body ul, .msg.bot .body ol { margin: 0 0 8px; padding-left: 20px; }
.msg.bot .body h4 { margin: 6px 0 4px; font-size: 13.5px; }
.msg.bot .body .tablebox { margin: 4px 0 8px; }
.msg.bot .body code { font-family: var(--font-num); font-size: 12px; background: var(--surface-2); padding: 1px 4px; border-radius: 4px; }
.thinking { display: flex; gap: 8px; align-items: center; color: var(--muted); }
.spin { width: 14px; height: 14px; border: 2px solid var(--line-2); border-top-color: var(--accent); border-radius: 50%; animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.calls summary { cursor: pointer; font-size: 12px; color: var(--muted); }
.calls ol { margin: 6px 0 0; padding-left: 18px; font-family: var(--font-num); font-size: 11px; color: var(--ink-2); word-break: break-word; }
.askform { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); }
.askform textarea { width: 100%; resize: vertical; min-height: 64px; border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; font: inherit; background: var(--surface); color: var(--ink); }
.askform textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
@media (max-width: 1080px) {

<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script>

<script>

<script>
(function () {
  'use strict';
  var CFG = window.CP_CONFIG || {};
  var FILE_ID = String(CFG.sheetId || '').trim();
  var TITLE = CFG.title || 'Cuentas Personales';
  var SERVER = 'Google Drive';
  var TOOL = 'download_file_content';
  var XLSX_MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  var M = FinModel;
  var TOPN = 7;

  var $ = function (id) { return document.getElementById(id); };
  var fmtEur = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var fmtEur0 = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
  var fmtPct = new Intl.NumberFormat('es-ES', { style: 'percent', maximumFractionDigits: 1 });
  function eur(n) { if (Math.abs(n) < 0.005) n = 0; return fmtEur.format(n); }
  function eur0(n) { if (Math.abs(n) < 0.5) n = 0; return fmtEur0.format(n); }
  function eurAxis(n) {
    var a = Math.abs(n);
    if (a >= 1000) return (n / 1000).toLocaleString('es-ES', { maximumFractionDigits: a >= 10000 ? 0 : 1 }) + ' k€';
    return n.toLocaleString('es-ES', { maximumFractionDigits: 0 }) + ' €';
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function sum(arr, f) { var s = 0; for (var i = 0; i < arr.length; i++) s += f ? f(arr[i]) : arr[i]; return s; }
  function todayYm() { var d = new Date(); return d.getFullYear() * 100 + d.getMonth() + 1; }
  function prevYm(k) { var y = Math.floor(k / 100), m = k % 100; return m === 1 ? (y - 1) * 100 + 12 : k - 1; }
  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem('cp.' + k)); localStorage.setItem('cp.' + k, JSON.stringify(v)); } catch (e) { return null; } }

  // ---------- Estado ----------
  var DATA = null, MONTHS = [], DIMS = {}, COLOR_RANK = {}, LAST = {};
  var S = {
    from: null, to: null, accounts: null, categories: null, subs: null, kind: 'all', q: '', min: null, max: null,
    zoom: null, nwMode: 'total', closed: new Set(), ieFocus: null, nwFocus: null, nwGroup: 'all', zSub: null, dim: 'sub', flowKind: 'Expense', matrixDim: 'sub', matrixKind: 'Expense', sort: { key: 'value', dir: 1 }
  };
  var saved = store('view');
  if (saved && saved.nwMode === 'accounts') saved.nwMode = 'groups';
  if (saved) ['nwMode', 'dim', 'flowKind', 'matrixDim', 'matrixKind'].forEach(function (k) { if (saved[k]) S[k] = saved[k]; });
  function saveView() { store('view', { nwMode: S.nwMode, dim: S.dim, flowKind: S.flowKind, matrixDim: S.matrixDim, matrixKind: S.matrixKind }); }

  // ---------- Carga ----------
  function setStatus(kind, text) {
    $('statusDot').className = 'dot ' + kind;
    $('statusText').textContent = text;
  }
  function banner(kind, html, actions) {
    var b = $('banner');
    if (!html) { b.innerHTML = ''; return; }
    b.innerHTML = '<div class="banner ' + kind + '"><p>' + html + '</p><span id="bannerActs"></span></div>';
    (actions || []).forEach(function (a) {
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'btn'; btn.textContent = a.label; btn.onclick = a.onClick;
      $('bannerActs').appendChild(btn);
    });
  }
  function loadFile(f) {
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try { ingest(XLSX.read(new Uint8Array(rd.result), { type: 'array' }), 'Fichero local · ' + f.name); }
      catch (e) { setStatus('bad', 'No se pudo leer el fichero'); banner('err', 'No se pudo leer «' + esc(f.name) + '» como hoja de cálculo. Exporta el Sheet como .xlsx (Archivo → Descargar → Microsoft Excel).'); }
    };
    rd.readAsArrayBuffer(f);
  }
  function pickFile() {
    var inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.xlsx,.xls,.ods';
    inp.onchange = function () { loadFile(inp.files && inp.files[0]); };
    inp.click();
  }
  function manualLoadAction() { return { label: 'Cargar .xlsx manualmente', onClick: pickFile }; }
  // Arrastrar un .xlsx a cualquier parte de la página lo carga (los datos no salen del navegador).
  document.addEventListener('dragover', function (e) { e.preventDefault(); document.body.classList.add('dragging'); });
  document.addEventListener('dragleave', function (e) { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
  document.addEventListener('drop', function (e) {
    e.preventDefault(); document.body.classList.remove('dragging');
    loadFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
  });
  function showDropzone(reason) {
    setStatus('bad', reason);
    var html = '<div class="dropzone"><h2>Carga tu hoja de cálculo</h2>' +
      '<p>Arrastra aquí el .xlsx exportado de tu Google Sheet, o elígelo desde tu ordenador. Se procesa solo en este navegador: no se sube a ningún sitio.</p>' +
      '<button class="btn primary" type="button" data-pick>Elegir fichero .xlsx</button>' +
      '<p class="hint">Necesita las hojas Expenses e Internal Transfers (y opcionalmente Inversiones) con las cabeceras del README.</p></div>';
    $('main').innerHTML = html;
    $('invMain').innerHTML = html;
    document.querySelectorAll('[data-pick]').forEach(function (b) { b.onclick = pickFile; });
  }

  var mcpNs = null, loading = false;
  function extractBase64(res) {
    var p = res && res.payload;
    if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { return p; } }
    if (p && typeof p.content === 'string') return p.content;
    if (p && p.content && typeof p.content.data === 'string') return p.content.data;
    var blocks = (res && res.content) || [];
    for (var i = 0; i < blocks.length; i++) {
      if (blocks[i].type === 'text') {
        try { var j = JSON.parse(blocks[i].text); if (j && typeof j.content === 'string') return j.content; } catch (e) {}
      }
      if (blocks[i].type === 'resource' && blocks[i].resource && blocks[i].resource.blob) return blocks[i].resource.blob;
    }
    return null;
  }

  function load(isRetry) {
    if (!mcpNs || loading) return;
    loading = true; $('refreshBtn').disabled = true;
    setStatus('busy', 'Leyendo el Sheet en Google Drive…');
    mcpNs.callTool(SERVER, TOOL, { fileId: FILE_ID, exportMimeType: XLSX_MIME }, { cache: false }).then(function (res) {
      loading = false;
      var b64 = extractBase64(res);
      if (!b64) throw { code: 'shape', message: 'El conector respondió sin el contenido del fichero.' };
      var wb = XLSX.read(b64.replace(/\s+/g, ''), { type: 'base64' });
      var when = res.cache && res.cache.storedAt ? new Date(res.cache.storedAt) : new Date();
      ingest(wb, 'Google Drive · ' + when.toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }));
      banner();
    }).catch(function (err) {
      loading = false; $('refreshBtn').disabled = false;
      var code = err && err.code;
      if (err && err.retryable && !isRetry) {
        setStatus('busy', 'Google Drive no respondió; reintentando…');
        setTimeout(function () { load(true); }, Math.max(err.retryAfterMs || 0, 1500 + Math.random() * 1500));
        return;
      }
      setStatus('bad', 'Sin conexión con el Sheet');
      var keep = DATA ? ' Se mantienen los últimos datos cargados.' : '';
      if (code === 'needs_reauth') banner('err', 'La sesión de Google Drive ha caducado. Vuelve a conectarlo en claude.ai → Ajustes → Conectores.' + keep, [{ label: 'Reintentar', onClick: function () { load(); } }]);
      else if (code === 'server_not_connected' || code === 'server_not_found') banner('err', 'Este dashboard lee tu Sheet con el conector Google Drive. Añádelo en claude.ai → Ajustes → Conectores y recarga.' + keep, [manualLoadAction()]);
      else if (code === 'selection_required') banner('warn', 'Tienes más de un conector Google Drive. Elige cuál usar en el aviso de claude.ai y pulsa Reintentar.', [{ label: 'Reintentar', onClick: function () { load(); } }]);
      else if (code === 'approval_required' || code === 'not_in_manifest' || code === 'consent_required') banner('warn', 'Para leer el Sheet, permite a esta página usar Google Drive.' + keep, [{ label: 'Permitir y cargar', onClick: function () { load(); } }]);
      else if (code === 'blocked_by_policy') banner('err', 'La política de tu organización bloquea el acceso a Google Drive desde esta página.', [manualLoadAction()]);
      else if (code === 'tool_error') banner('err', 'Google Drive no pudo exportar el Sheet: ' + esc(err.message || '') + '. Comprueba que tu cuenta tiene acceso al fichero.' + keep, [{ label: 'Reintentar', onClick: function () { load(); } }, manualLoadAction()]);
      else if (code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') banner('warn', 'Esta vista no puede usar conectores. Ábrela en claude.ai o carga el fichero a mano.', [manualLoadAction()]);
      else banner('err', 'No se pudo leer el Sheet (' + esc(code || 'error') + '): ' + esc((err && err.message) || '') + keep, [{ label: 'Reintentar', onClick: function () { load(); } }, manualLoadAction()]);
      if (!DATA) $('main').innerHTML = '<div class="empty">Sin datos todavía. Cuando el Sheet se lea, aquí aparecerán patrimonio, ingresos, gastos y el detalle mensual.</div>';
    });
  }

  function ingest(wb, sourceLabel) {
    try {
      DATA = M.parseWorkbook(XLSX, wb);
    } catch (e) {
      setStatus('bad', 'Formato no reconocido');
      banner('err', esc(e.message));
      $('refreshBtn').disabled = !mcpNs;
      return;
    }
    banner();
    MONTHS = M.monthRange(DATA, todayYm());
    buildDims();
    var lastData = MONTHS[MONTHS.length - 1];
    if (S.from == null || MONTHS.indexOf(S.from) === -1) S.from = MONTHS[0];
    if (S.to == null || MONTHS.indexOf(S.to) === -1 || S.to === S.lastAuto) { S.to = lastData; S.lastAuto = lastData; }
    if (S.zoom == null || MONTHS.indexOf(S.zoom) === -1) S.zoom = MONTHS.indexOf(todayYm()) !== -1 ? todayYm() : lastData;
    var n = DATA.tx.filter(function (t) { return !t.opening; }).length;
    setStatus('ok', sourceLabel + ' · ' + n.toLocaleString('es-ES') + ' movimientos · ' + DATA.tr.length.toLocaleString('es-ES') + ' traspasos');
    $('refreshBtn').disabled = !mcpNs;
    if (DATA.problems.length) banner('warn', esc(DATA.problems.join(' ')));
    buildLayout();
    buildFilters();
    renderAll();
    ingestInv(wb);
    setView(VIEW);
    updateAskFab();
  }

  // ---------- Dimensiones y colores estables ----------
  function buildDims() {
    var acc = {}, cat = {}, sub = {}, subCat = {};
    DATA.tx.forEach(function (t) {
      acc[t.account] = (acc[t.account] || 0) + 1;
      if (t.opening) return;
      cat[t.category] = (cat[t.category] || 0) + 1;
      sub[t.sub] = (sub[t.sub] || 0) + 1;
      subCat[t.sub] = subCat[t.sub] || t.category;
    });
    DATA.tr.forEach(function (t) { acc[t.from] = acc[t.from] || 0; acc[t.to] = acc[t.to] || 0; });
    DIMS = { account: Object.keys(acc).sort(coll), category: Object.keys(cat).sort(coll), sub: Object.keys(sub).sort(coll), subCat: subCat, counts: { account: acc, category: cat, sub: sub } };
    // Color por entidad: ranking global (sin filtros) para que un filtro nunca repinte las series.
    var full = M.balances(DATA, MONTHS);
    var last = MONTHS.length - 1;
    COLOR_RANK.account = Object.keys(full.byAccount).sort(function (a, b) { return Math.abs(full.byAccount[b][last]) - Math.abs(full.byAccount[a][last]); });
    ['sub', 'category'].forEach(function (d) {
      var tot = {};
      DATA.tx.forEach(function (t) { if (!t.opening) tot[t[d]] = (tot[t[d]] || 0) + t.value; });
      COLOR_RANK[d] = Object.keys(tot).sort(function (a, b) { return tot[b] - tot[a]; });
    });
  }
  function coll(a, b) { return a.localeCompare(b, 'es'); }
  var SERIES_VARS = ['--s1', '--s2', '--s3', '--s4', '--s5', '--s6', '--s7', '--s8'];
  function colorFor(dim, name) {
    if (name === 'Otras' || name === 'Otros') return css('--other');
    var i = (COLOR_RANK[dim] || []).indexOf(name);
    return i >= 0 && i < SERIES_VARS.length ? css(SERIES_VARS[i]) : css('--other');
  }
  function fieldOf(dim) { return dim === 'account' ? 'account' : dim === 'category' ? 'category' : 'sub'; }
  var DIM_LABEL = { sub: 'Subcategoría', category: 'Categoría', account: 'Cuenta' };

  // ---------- Filtros ----------
  function passFlow(t, ignoreDates) {
    if (t.opening) return false;
    if (!ignoreDates && (t.ym < S.from || t.ym > S.to)) return false;
    if (S.accounts && !S.accounts.has(t.account)) return false;
    if (S.categories && !S.categories.has(t.category)) return false;
    if (S.subs && !S.subs.has(t.sub)) return false;
    if (S.kind !== 'all' && t.kind !== S.kind) return false;
    if (S.min != null && Math.abs(t.value) < S.min) return false;
    if (S.max != null && Math.abs(t.value) > S.max) return false;
    if (S.q) { var q = S.q; if (t.concept.toLowerCase().indexOf(q) === -1) return false; }
    return true;
  }
  function rangeMonths() { return MONTHS.filter(function (k) { return k >= S.from && k <= S.to; }); }

  function monthOptions(sel) {
    return MONTHS.map(function (k) { return '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + M.ymLabel(k) + '</option>'; }).join('');
  }
  function msHtml(id, label, dim) {
    return '<details class="ms" id="ms-' + id + '"><summary class="field"><label>' + label + '</label><span class="val" id="msv-' + id + '">Todas</span></summary>' +
      '<div class="pop"><input type="search" placeholder="Buscar…" id="mss-' + id + '" aria-label="Buscar ' + label + '">' +
      '<div class="acts"><button type="button" class="btn ghost" data-all="' + id + '">Todas</button><button type="button" class="btn ghost" data-none="' + id + '">Ninguna</button></div>' +
      '<div class="list" id="msl-' + id + '">' + DIMS[dim].map(function (v) {
        return '<label class="opt"><input type="checkbox" value="' + esc(v) + '" checked> <span>' + esc(v) + '</span><span class="c">' + (DIMS.counts[dim][v] || 0) + '</span></label>';
      }).join('') + '</div></div></details>';
  }
  var MS = { acc: { dim: 'account', key: 'accounts', label: 'Cuentas' }, cat: { dim: 'category', key: 'categories', label: 'Categoría' }, sub: { dim: 'sub', key: 'subs', label: 'Subcategoría' } };

  function buildFilters() {
    var f = $('fbody');
    f.innerHTML =
      '<div class="field"><label for="fFrom">Desde</label><select id="fFrom">' + monthOptions(S.from) + '</select></div>' +
      '<div class="field"><label for="fTo">Hasta</label><select id="fTo">' + monthOptions(S.to) + '</select></div>' +
      '<div class="seg" role="group" aria-label="Periodo rápido"><button type="button" data-q="12">12 m</button><button type="button" data-q="ytd">Año</button><button type="button" data-q="all">Todo</button></div>' +
      msHtml('acc', 'Cuentas', 'account') + msHtml('cat', 'Categoría', 'category') + msHtml('sub', 'Subcategoría', 'sub') +
      '<div class="seg" role="group" aria-label="Tipo"><button type="button" data-k="all">Todo</button><button type="button" data-k="Income">Ingresos</button><button type="button" data-k="Expense">Gastos</button></div>' +
      '<div class="field"><label for="fQ">Concepto</label><input type="search" id="fQ" placeholder="p. ej. Mercadona" value="' + esc(S.q) + '"></div>' +
      '<div class="field"><label for="fMin">Importe</label><input type="number" id="fMin" placeholder="mín" min="0" step="any" inputmode="decimal"><span class="muted">–</span><input type="number" id="fMax" placeholder="máx" min="0" step="any" inputmode="decimal" aria-label="Importe máximo"></div>' +
      '<button type="button" class="btn ghost" id="fClear">Limpiar filtros</button>';

    $('fFrom').onchange = function () { S.from = +this.value; if (S.from > S.to) S.to = S.from; syncFilterUI(); renderAll(); };
    $('fTo').onchange = function () { S.to = +this.value; S.lastAuto = null; if (S.to < S.from) S.from = S.to; syncFilterUI(); renderAll(); };
    f.querySelectorAll('[data-q]').forEach(function (b) {
      b.onclick = function () {
        var last = MONTHS[MONTHS.length - 1], q = b.getAttribute('data-q');
        S.to = last; S.lastAuto = last;
        if (q === 'all') S.from = MONTHS[0];
        else if (q === 'ytd') S.from = Math.max(MONTHS[0], Math.floor(last / 100) * 100 + 1);
        else { var k = last; for (var i = 0; i < 11; i++) k = prevYm(k); S.from = Math.max(MONTHS[0], k); }
        syncFilterUI(); renderAll();
      };
    });
    f.querySelectorAll('[data-k]').forEach(function (b) { b.onclick = function () { S.kind = b.getAttribute('data-k'); syncFilterUI(); renderAll(); }; });
    var qT; $('fQ').oninput = function () { var v = this.value.trim().toLowerCase(); clearTimeout(qT); qT = setTimeout(function () { S.q = v; syncFilterUI(); renderAll(); }, 200); };
    function numInput(id, key) {
      var t; $(id).oninput = function () { var v = this.value === '' ? null : Math.abs(parseFloat(this.value)); clearTimeout(t); t = setTimeout(function () { S[key] = isFinite(v) ? v : null; syncFilterUI(); renderAll(); }, 250); };
    }
    numInput('fMin', 'min'); numInput('fMax', 'max');
    $('fClear').onclick = clearFilters;

    Object.keys(MS).forEach(function (id) {
      var cfg = MS[id], list = $('msl-' + id);
      list.onchange = function () {
        var boxes = list.querySelectorAll('input'), on = [];
        boxes.forEach(function (b) { if (b.checked) on.push(b.value); });
        S[cfg.key] = on.length === boxes.length ? null : new Set(on);
        syncFilterUI(); renderAll();
      };
      $('mss-' + id).oninput = function () {
        var q = this.value.trim().toLowerCase();
        list.querySelectorAll('label.opt').forEach(function (l) { l.hidden = q && l.textContent.toLowerCase().indexOf(q) === -1; });
      };
      document.querySelector('[data-all="' + id + '"]').onclick = function () { S[cfg.key] = null; syncFilterUI(); renderAll(); };
      document.querySelector('[data-none="' + id + '"]').onclick = function () { S[cfg.key] = new Set(); syncFilterUI(); renderAll(); };
    });
    document.querySelectorAll('details.ms').forEach(function (d) {
      d.addEventListener('toggle', function () { if (d.open) document.querySelectorAll('details.ms').forEach(function (o) { if (o !== d) o.open = false; }); });
    });
    $('ftoggle').onclick = function () { var open = $('filters').classList.toggle('open'); this.setAttribute('aria-expanded', open); };
    syncFilterUI();
  }
  document.addEventListener('click', function (e) {
    document.querySelectorAll('details.ms[open]').forEach(function (d) { if (!d.contains(e.target)) d.open = false; });
  });

  }

  function renderKpis(months, flows, bal) {
    var iTo = MONTHS.indexOf(S.to), iFrom = MONTHS.indexOf(S.from);
    var nw = bal.total[iTo], nwPrev = iTo > 0 ? bal.total[iTo - 1] : null, nwStart = iFrom > 0 ? bal.total[iFrom - 1] : null;
    var inc = sum(flows.filter(function (t) { return t.kind === 'Income'; }), function (t) { return t.value; });
    var exp = sum(flows.filter(function (t) { return t.kind === 'Expense'; }), function (t) { return t.value; });
    var net = inc - exp, rate = inc > 0 && net / inc >= -1 ? net / inc : null;
    function delta(v, label) {
      if (v == null) return '';
      var cls = v > 0.5 ? 'rise good' : v < -0.5 ? 'fall bad' : '';
      return '<span class="delta ' + cls + ' num">' + (v > 0 ? '+' : '') + eur0(v) + '</span><span>' + label + '</span>';
    }
    $('kpis').innerHTML =
      '<div class="kpi hero"><span class="eyebrow">Patrimonio neto · ' + M.ymLong(S.to) + '</span><span class="v num">' + eur(nw) + '</span><span class="d">' +
        delta(nwPrev != null ? nw - nwPrev : null, 'vs mes anterior') + ' ' + delta(nwStart != null ? nw - nwStart : null, 'en el periodo') + '</span></div>' +
      kpi('Ingresos', eur(inc), months.length + (months.length === 1 ? ' mes' : ' meses') + ' · ' + eur0(inc / Math.max(1, months.length)) + '/mes') +
      kpi('Gastos', eur(exp), eur0(exp / Math.max(1, months.length)) + '/mes de media') +
      kpi('Ahorro neto', eur(net), 'Ingresos − gastos del periodo') +
      kpi('Tasa de ahorro', rate == null ? '—' : fmtPct.format(rate), 'Sobre ingresos');
    function kpi(l, v, d) { return '<div class="kpi"><span class="eyebrow">' + l + '</span><span class="v num">' + v + '</span><span class="d">' + d + '</span></div>'; }

  // Grupos de cuentas, en el orden definido en la configuración.
  var GROUP_SLOTS = ['--s1', '--s3', '--s5', '--s2', '--s7', '--s4', '--s6', '--s8'];
  var GROUPS = (CFG.accountGroups || []).map(function (g, i) {
    return { name: g.name, accounts: g.accounts || [], color: g.color || GROUP_SLOTS[i % GROUP_SLOTS.length] };
  });
  var OTHER_GROUP = 'Otras cuentas';
  function groupOf(account) {
    var a = account.toLowerCase();
    for (var i = 0; i < GROUPS.length; i++) {
      if (GROUPS[i].accounts.some(function (x) { return x.toLowerCase() === a; })) return GROUPS[i].name;
    }
    return OTHER_GROUP;
  }
  function groupColor(g) {
    for (var i = 0; i < GROUPS.length; i++) if (GROUPS[i].name === g) return css(GROUPS[i].color);
    return css('--other');
  }
  function groupBalances(bal) {
    var out = {};
    Object.keys(bal.byAccount).forEach(function (a) {
      var g = groupOf(a), arr = bal.byAccount[a];
      if (!out[g]) out[g] = arr.map(function () { return 0; });
      arr.forEach(function (v, i) { out[g][i] += v; });
    });
    Object.keys(out).forEach(function (g) { out[g] = out[g].map(M.round2); });
    return out;
  }
  function groupOrder(names) {
    var order = GROUPS.map(function (g) { return g.name; }).concat([OTHER_GROUP]);
    return names.slice().sort(function (a, b) { return order.indexOf(a) - order.indexOf(b); });
  }

  function renderNW() {
    var months = LAST.months, bal = LAST.bal; if (!months) return;

  function renderAccTable() {
    var bal = LAST.bal; if (!bal) return;
    var iTo = MONTHS.indexOf(S.to), iPrev = iTo > 0 ? iTo - 1 : null, i12 = iTo - 12;
    function row(arr) { return { v: arr[iTo], d1: iPrev != null ? arr[iTo] - arr[iPrev] : null, d12: i12 >= 0 ? arr[iTo] - arr[i12] : null }; }
    var byGroup = {};

    var gb = groupBalances(bal);
    var total = bal.total[iTo], tr = row(bal.total);
    $('accSub').textContent = 'A fin de ' + M.ymLong(S.to) + ' · las variaciones comparan saldos, no rentabilidad · pulsa un grupo para plegarlo';
    function d(v) { if (v == null) return '<td class="r muted">—</td>'; var c = v > 0.5 ? 'rise good' : v < -0.5 ? 'fall bad' : ''; return '<td class="r num"><span class="delta ' + c + '">' + (v > 0 ? '+' : '') + eur0(v) + '</span></td>'; }
    function pct(v) { return '<td class="r num muted">' + (total ? fmtPct.format(v / total) : '—') + '</td>'; }
    var body = '';
    groupOrder(Object.keys(byGroup)).forEach(function (g) {
      var accs = byGroup[g].sort(coll);
      var gr = row(gb[g]);
      if (g === OTHER_GROUP && Math.abs(gr.v) < 0.005 && accs.every(function (a) { return Math.abs(bal.byAccount[a][iTo]) < 0.005; })) return;

    var years = []; ops.forEach(function (o) { if (years.indexOf(o.y) === -1) years.push(o.y); }); years.sort();
    var dep = {}, wd = {}; years.forEach(function (y) { dep[y] = 0; wd[y] = 0; });
    ops.forEach(function (o) { if (o.action === 'Deposit') dep[o.y] += o.value; else wd[o.y] += o.value; });
    var c = chart('chInvYear'), o = baseOpt(), cD = css('--net'), cW = css('--s2');
    o.xAxis.data = years.map(String);
    o.series = [
      { name: 'Aportaciones', type: 'bar', data: years.map(function (y) { return M.round2(dep[y]); }), barMaxWidth: 34, barGap: '10%', itemStyle: { color: cD, borderRadius: [4, 4, 0, 0] }, label: { show: true, position: 'top', formatter: function (p) { return compact(p.value); }, color: css('--ink-2'), fontSize: 10.5, fontFamily: css('--font-num') } },
      { name: 'Retiradas y cobros', type: 'bar', data: years.map(function (y) { return M.round2(wd[y]); }), barMaxWidth: 34, itemStyle: { color: cW, borderRadius: [4, 4, 0, 0] }, label: { show: true, position: 'top', formatter: function (p) { return p.value ? compact(p.value) : ''; }, color: css('--ink-2'), fontSize: 10.5, fontFamily: css('--font-num') } }
    ];
    o.grid.top = 24;
    o.tooltip.axisPointer = { type: 'shadow', shadowStyle: { color: hexA(css('--muted'), .1) } };
    o.tooltip.formatter = function (p) { return tipRows('Año ' + years[p[0].dataIndex], p.map(function (s) { return { n: s.seriesName, v: s.value, c: s.color }; })); };
    c.setOption(o, true);
    $('invYearLegend').innerHTML = legendHtml([{ n: 'Aportaciones', c: cD }, { n: 'Retiradas y cobros', c: cW }]);
  }

  function renderInvOps() {
    $('opAsset').value = IS.opAsset;
    $('opAction').querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-v') === IS.opAction); });
    var rows = invOps().filter(function (o) { return (IS.opAsset === 'all' || o.asset === IS.opAsset) && (IS.opAction === 'all' || o.action === IS.opAction); });
    var key = IS.opSort.key, dir = IS.opSort.dir;
    var g = { date: function (o) { return o.date; }, concept: function (o) { return o.concept.toLowerCase(); }, asset: function (o) { return o.asset.toLowerCase(); }, category: function (o) { return o.category; }, action: function (o) { return o.action; }, value: function (o) { return o.value; }, inv: function (o) { return o.inv; }, pl: function (o) { return o.pl; } }[key];
    rows.sort(function (a, b) { var x = g(a), y = g(b); return (x < y ? -1 : x > y ? 1 : 0) * dir || (b.date - a.date); });
    var cols = [['date', 'Fecha'], ['concept', 'Concepto'], ['asset', 'Activo'], ['category', 'Categoría'], ['action', 'Acción'], ['value', 'Importe', 'r'], ['inv', 'Δ capital', 'r'], ['pl', 'P&L', 'r']];
    $('invOps').innerHTML = '<thead><tr>' + cols.map(function (cl) { return '<th data-s="' + cl[0] + '"' + (cl[2] ? ' class="r"' : '') + (cl[0] === key ? ' aria-sort="' + (dir > 0 ? 'ascending' : 'descending') + '"' : '') + '>' + cl[1] + '</th>'; }).join('') + '</tr></thead><tbody>' +
      (rows.length ? rows.map(function (o) {
        var dep = o.action === 'Deposit';
        return '<tr><td class="num">' + fmtDate(o.date) + '</td><td>' + esc(o.concept) + '</td><td>' + esc(o.asset) + '</td><td><i style="display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:' + invCatColor(o.category) + '"></i>' + esc(o.category) + '</td>' +
          '<td><span class="tag ' + (dep ? 'dep' : 'wd') + '">' + (dep ? 'Aportación' : 'Retirada') + '</span></td><td class="r num">' + eur(o.value) + '</td>' +
          '<td class="r num ' + (Math.abs(o.inv) < 0.005 ? 'muted' : '') + '">' + (o.inv > 0.004 ? '+' : '') + eur(o.inv) + '</td>' +
          '<td class="r num ' + (o.pl > 0.004 ? 'inc' : o.pl < -0.004 ? 'exp' : 'muted') + '">' + (Math.abs(o.pl) < 0.005 ? '—' : (o.pl > 0 ? '+' : '') + eur(o.pl)) + '</td></tr>';
      }).join('') : '<tr><td colspan="8" class="empty">Sin operaciones con estos filtros.</td></tr>') + '</tbody>';
    $('opCount').textContent = rows.length + ' operaciones';
  }

  // ---------- Cambio de panel ----------
  function setView(v) {
    VIEW = v === 'inv' ? 'inv' : 'fin';
    store('panel', VIEW);
    $('viewSwitch').querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-v') === VIEW); });
    $('main').hidden = VIEW !== 'fin';
    $('invMain').hidden = VIEW !== 'inv';
    $('filters').hidden = VIEW !== 'fin' || !DATA;
    $('footnote').hidden = VIEW !== 'fin' || !DATA;
    $('pageTitle').textContent = VIEW === 'inv' ? 'Inversiones' : TITLE;
    $('pageEyebrow').textContent = VIEW === 'inv' ? 'Cartera · hoja Inversiones' : 'Finanzas personales' + (MONTHS.length ? ' · desde ' + M.ymLong(MONTHS[0]).replace(/^(\S+)/, function (m) { return m.slice(0, 3); }) : '');
    try { history.replaceState(null, '', VIEW === 'inv' ? '#inversiones' : '#finanzas'); } catch (e) {}
    if (VIEW === 'inv') renderInv();
    else Object.keys(charts).forEach(function (k) { charts[k].resize(); });
  }

  // ---------- Preguntar a tus datos (capacidad sample) ----------
  var ASK = { fn: null, ok: false, turns: [], busy: false, ctl: null };
  var ASK_SUGGEST = [
    '¿En qué subcategorías he gastado más este año que el anterior?',
    '¿Cuál ha sido mi tasa de ahorro por año?',
    '¿Cómo ha evolucionado mi patrimonio en los últimos 12 meses y por qué?'
  ];
  function mdInline(s) {
    return s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
  }
  // Markdown mínimo y seguro: el texto se escapa antes de dar formato.
  function md(text) {
    var lines = esc(text).split('\n'), out = [], i = 0;
    var isRow = function (x) { return /^\s*\|.*\|\s*$/.test(x); };
    var isItem = function (x) { return /^\s*([-*•]|\d+\.)\s+/.test(x); };
    while (i < lines.length) {
      var l = lines[i];
      if (isRow(l)) {
        var rows = [];
        while (i < lines.length && isRow(lines[i])) { rows.push(lines[i]); i++; }
        rows = rows.filter(function (r) { return !/^\s*\|[\s:|-]+\|\s*$/.test(r); });
        out.push('<div class="tablebox"><table>' + rows.map(function (r, ri) {
          var cells = r.trim().replace(/^\||\|$/g, '').split('|');
          return '<tr>' + cells.map(function (c) {
            var t = ri === 0 ? 'th' : 'td', n = /^\s*[-+−]?[\d.,]+\s*(€|%)?\s*$/.test(c);
            return '<' + t + (n ? ' class="r num"' : '') + '>' + mdInline(c.trim()) + '</' + t + '>';
          }).join('') + '</tr>';
        }).join('') + '</table></div>');
        continue;
      }
      if (isItem(l)) {
        var ordered = /^\s*\d+\./.test(l), items = [];
        while (i < lines.length && isItem(lines[i])) { items.push(lines[i].replace(/^\s*([-*•]|\d+\.)\s+/, '')); i++; }
        var tag = ordered ? 'ol' : 'ul';
        out.push('<' + tag + '>' + items.map(function (x) { return '<li>' + mdInline(x) + '</li>'; }).join('') + '</' + tag + '>');
        continue;
      }
      var h = l.match(/^\s*#{1,4}\s+(.*)$/);
      if (h) { out.push('<h4>' + mdInline(h[1]) + '</h4>'); i++; continue; }
      if (!l.trim()) { i++; continue; }
      var para = [];
      while (i < lines.length && lines[i].trim() && !isRow(lines[i]) && !isItem(lines[i]) && !/^\s*#/.test(lines[i])) { para.push(lines[i]); i++; }
      out.push('<p>' + mdInline(para.join('<br>')) + '</p>');
    }
    return out.join('');
  }
  function askCtx() {
    return { data: DATA, months: MONTHS, groups: GROUPS, invOps: INV ? INV.ops : [],
      today: new Date().toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' }) };
  }
  function updateAskFab() { $('askFab').hidden = !(ASK.ok && DATA); }
  function openAsk(open) {
    $('askPanel').hidden = !open;
    $('askFab').setAttribute('aria-expanded', String(open));
    if (open) { renderAskEmpty(); setTimeout(function () { $('askInput').focus(); }, 30); }
  }
  function renderAskEmpty() {
    if (ASK.turns.length || $('askLog').children.length) return;
    $('askLog').innerHTML = '<div class="askintro"><p>Pregunta lo que quieras sobre tus cuentas e inversiones. Claude consulta tus datos con las mismas reglas que los gráficos y responde aquí.</p>' +
      '<div class="asksug">' + ASK_SUGGEST.map(function (s) { return '<button type="button" class="chipbtn">' + esc(s) + '</button>'; }).join('') + '</div>' +
      '<p class="hint">Usa todos los datos, sin los filtros del dashboard. Funciona con tu cuenta de Claude; la primera vez te pide permiso. Las preguntas complejas pueden tardar uno o dos minutos.</p></div>';
    $('askLog').querySelectorAll('.chipbtn').forEach(function (b) { b.onclick = function () { $('askInput').value = b.textContent; askSend(); }; });
  }
  var ASK_ERR = {
    not_granted: 'No se ha dado permiso a esta página para usar Claude. Puedes activarlo desde el menú de permisos del artifact.',
    sampling_disabled: 'Claude no está disponible para esta cuenta u organización.',
    tools_unavailable: 'Esta vista no puede ejecutar las consultas de datos que necesita el asistente.',
    rate_limited: 'Has alcanzado el límite de uso de momento. Prueba de nuevo en un rato.',
    session_expired: 'La sesión de claude.ai ha caducado. Vuelve a iniciar sesión y recarga.',
    prompt_too_large: 'La conversación es demasiado larga. Pulsa «Nueva conversación».',
    refused: 'Claude no ha respondido a esta pregunta. Prueba a formularla de otra manera.',
    empty_completion: 'Claude no ha devuelto respuesta. Prueba con una pregunta más concreta.'
  };
  function askSend() {
    var q = $('askInput').value.trim();
    if (!q || ASK.busy || !ASK.fn || !DATA) return;
    $('askInput').value = '';
    var intro = $('askLog').querySelector('.askintro'); if (intro) intro.remove();
    ASK.turns.push({ role: 'user', content: q });
    var log = $('askLog');
    var u = document.createElement('div'); u.className = 'msg user'; u.textContent = q; log.appendChild(u);
    var a = document.createElement('div'); a.className = 'msg bot';
    a.innerHTML = '<div class="thinking"><span class="spin"></span><span class="tstat">Pensando…</span></div><div class="body"></div>' +
      '<details class="calls" hidden><summary></summary><ol></ol></details><p class="hint note" hidden></p>';
    log.appendChild(a);
    a.scrollIntoView({ block: 'end' });
    var body = a.querySelector('.body'), think = a.querySelector('.thinking'), stat = a.querySelector('.tstat');
    var calls = a.querySelector('.calls'), note = a.querySelector('.note'), nCalls = 0;
    var tools = FinAgent.tools(askCtx(), function (msg) { stat.textContent = msg + '…'; think.hidden = false; }).map(function (t) {
      return { name: t.name, description: t.description, inputSchema: t.inputSchema, execute: function (input, c) {
        nCalls++;
        calls.hidden = false;
        calls.querySelector('summary').textContent = 'Consultas a tus datos (' + nCalls + ')';
        var li = document.createElement('li'); li.textContent = t.name + ' ' + JSON.stringify(input); calls.querySelector('ol').appendChild(li);
        return t.execute(input, c);
      } };
    });
    var recent = ASK.turns.slice(-12);
    while (recent.length && recent[0].role !== 'user') recent.shift();
    var input = [{ role: 'user', content: FinAgent.instructions(askCtx()) }].concat(recent);
    ASK.busy = true; ASK.ctl = new AbortController();
    $('askSend').hidden = true; $('askStop').hidden = false;
    ASK.fn(input, {
      modelTier: 'complex', tools: tools, signal: ASK.ctl.signal,
      onText: function (upd) { think.hidden = true; body.innerHTML = md(upd.text); }
    }).then(function (res) {
      body.innerHTML = md(res.text);
      ASK.turns.push({ role: 'assistant', content: res.text });
      if (res.truncated) { note.hidden = false; note.textContent = 'La respuesta se cortó por longitud. Pide algo más acotado.'; }
    }).catch(function (e) {
      var code = e && e.code;
      if (e && e.text) { body.innerHTML = md(e.text); ASK.turns.push({ role: 'assistant', content: e.text }); }
      else if (code === 'refused') body.innerHTML = '';
      note.hidden = false;
      note.textContent = code === 'cancelled' ? 'Detenido.' : (ASK_ERR[code] || 'No se pudo completar la respuesta (' + (code || 'error') + '). Inténtalo de nuevo.');
      if (code === 'not_granted' || code === 'sampling_disabled' || code === 'tools_unavailable') { ASK.ok = false; $('askForm').hidden = true; }
    }).then(function () {
      think.hidden = true;
      ASK.busy = false; ASK.ctl = null;
      $('askSend').hidden = false; $('askStop').hidden = true;
      a.scrollIntoView({ block: 'nearest' });
    });
  }
  function initAsk() {
    $('askFab').onclick = function () { openAsk($('askPanel').hidden); };
    $('askClose').onclick = function () { openAsk(false); };
    $('askNew').onclick = function () { if (ASK.busy && ASK.ctl) ASK.ctl.abort(); ASK.turns = []; $('askLog').innerHTML = ''; renderAskEmpty(); };
    $('askStop').onclick = function () { if (ASK.ctl) ASK.ctl.abort(); };
    $('askForm').onsubmit = function (e) { e.preventDefault(); askSend(); };
    $('askInput').onkeydown = function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); askSend(); } };
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('askPanel').hidden) openAsk(false); });
    if (!(window.claude && typeof window.claude.use === 'function')) return;
    window.claude.use('sample').then(function (fn) {
      if (!fn) return;
      ASK.fn = fn;
      return fn.limits().then(function (l) { ASK.ok = !!(l && l.tools && l.tools.maxCount >= 6); updateAskFab(); });
    }).catch(function () {});
  }

  // ---------- Tema y tamaño ----------
  var rT;
  window.addEventListener('resize', function () { clearTimeout(rT); rT = setTimeout(function () { Object.keys(charts).forEach(function (k) { charts[k].resize(); }); }, 120); });

  // ---------- Arranque ----------
  $('refreshBtn').onclick = function () { load(); };
  initAsk();
  $('viewSwitch').onclick = function (e) { var b = e.target.closest('button'); if (b) setView(b.getAttribute('data-v')); };
  (function () {
    var h = (location.hash || '').replace('#', '');
    VIEW = h === 'inversiones' ? 'inv' : h === 'finanzas' ? 'fin' : (store('panel') === 'inv' ? 'inv' : 'fin');
    $('viewSwitch').querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-v') === VIEW); });
    $('main').hidden = VIEW !== 'fin'; $('invMain').hidden = VIEW !== 'inv';
  })();
  function noMcp() {
    if (DATA) return;
    showDropzone(FILE_ID ? 'Sin conexión con Google Drive en esta vista' : 'Modo local: sin Google Sheet configurado');
  }
  if (!FILE_ID) {
    setTimeout(noMcp, 0);
  } else if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('mcp').then(function (ns) {
      if (!ns) { noMcp(); return; }
      mcpNs = ns; load();
    }).catch(noMcp);
  } else {
    setTimeout(function () { if (!mcpNs) noMcp(); }, 0);
  }
  window.__cpIngest = ingest;
})();
</script>
